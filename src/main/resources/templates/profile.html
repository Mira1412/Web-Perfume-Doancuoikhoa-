<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân — Halo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
    <style>
        :root {
            --gold: #b8860b;
            --gold-light: #daa520;
            --gold-dark: #8b6914;
            --cream: #FFF8F0;
            --cream-2: #FDF2E9;
            --cream-3: #FAE8D4;
            --text-primary: #000000;
            --text-muted: rgba(240, 236, 228, 0.7);
            --border: rgba(184, 134, 11, 0.15);
        }

        body {
            background-color: var(--text-primary) ;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }
        .navbar-custom {
            background: rgba(255, 248, 240, 0.92);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }

        .brand-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold) !important;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(184, 134, 11, 0.2);
        }
        .profile-container {
            margin-top: 50px;
            margin-bottom: 80px;
        }

        .card-custom {
            background: var(--cream-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
        }

        .form-control {
            background: var(--cream-3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary) ;
        }

        .form-control:focus {
            background: var(--cream-3);
            border-color: var(--gold);
            color: var(--text-primary) ;
            box-shadow: none;
        }

        .form-control:disabled,
        .form-control[readonly] {
            background: rgba(0, 0, 0, 0.2);
            color: #2d2626;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), #a07840);
            color: #1a1a1a;
            font-weight: 600;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.3);
        }

        .section-title {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
    
        /* ==================== LUXURY FLOATING BACKGROUND ==================== */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .floating-particle {
            position: absolute;
            bottom: -60px;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* Silver bokeh orbs â€” bright shimmering */
        .floating-particle.bokeh {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                rgba(220, 230, 255, 0.45) 0%, 
                rgba(200, 215, 240, 0.2) 35%, 
                rgba(180, 200, 230, 0.05) 65%,
                transparent 80%);
            box-shadow: 
                inset 0 0 20px rgba(220, 230, 255, 0.2),
                0 0 30px rgba(200, 220, 255, 0.15),
                0 0 60px rgba(180, 200, 245, 0.06);
        }

        /* Elegant petals â€” visible silver shimmer */
        .floating-particle.petal {
            border-radius: 80% 0 55% 50% / 55% 0 80% 50%;
            background: linear-gradient(135deg, 
                rgba(210, 220, 245, 0.5) 0%, 
                rgba(190, 205, 235, 0.25) 50%, 
                rgba(175, 190, 225, 0.08) 100%);
            border: 1px solid rgba(220, 230, 255, 0.15);
            box-shadow: 0 0 12px rgba(200, 215, 250, 0.1);
        }

        /* Diamond sparkle â€” brilliant white-silver glints */
        .floating-particle.sparkle {
            background: rgba(240, 245, 255, 1);
            border-radius: 50%;
            box-shadow: 
                0 0 6px rgba(220, 230, 255, 0.9),
                0 0 15px rgba(200, 215, 250, 0.6),
                0 0 30px rgba(180, 200, 245, 0.3),
                0 0 45px rgba(160, 185, 240, 0.1);
        }

        /* Ambient mist â€” visible cool silver glow */
        .floating-particle.mist {
            border-radius: 50%;
            background: radial-gradient(ellipse at center,
                rgba(160, 180, 230, 0.1) 0%,
                rgba(180, 200, 240, 0.05) 45%,
                transparent 70%);
            filter: blur(25px);
        }

        /* Silver thread â€” visible shimmering lines */
        .floating-particle.thread {
            width: 1px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(210, 220, 250, 0.3) 25%,
                rgba(230, 240, 255, 0.5) 50%,
                rgba(210, 220, 250, 0.3) 75%,
                transparent 100%);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(200, 215, 250, 0.2);
        }

        @keyframes floatUpLuxury {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            8% {
                opacity: var(--max-opacity, 0.7);
            }
            25% {
                transform: translateY(-25vh) translateX(var(--sway-1, 20px)) rotate(45deg);
            }
            50% {
                opacity: var(--mid-opacity, 0.5);
                transform: translateY(-50vh) translateX(var(--sway-2, -15px)) rotate(120deg);
            }
            75% {
                transform: translateY(-75vh) translateX(var(--sway-3, 10px)) rotate(200deg);
                opacity: var(--fade-opacity, 0.25);
            }
            100% {
                transform: translateY(-110vh) translateX(var(--sway-4, -5px)) rotate(300deg);
                opacity: 0;
            }
        }

        @keyframes driftSlow {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            33% { transform: translateX(var(--drift-x, 15px)) rotate(var(--drift-r, 3deg)); }
            66% { transform: translateX(calc(var(--drift-x, 15px) * -0.7)) rotate(calc(var(--drift-r, 3deg) * -1)); }
        }

        @keyframes pulseSparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes mistDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: var(--mist-opacity, 0.08); }
            50% { transform: translate(var(--mist-x, 50px), -30vh) scale(1.2); }
            80% { opacity: var(--mist-opacity, 0.08); }
            100% { transform: translate(var(--mist-x2, -30px), -60vh) scale(0.8); opacity: 0; }
        }
    </style>
</head>

<body>
    <!-- ==================== FLOATING BACKGROUND ==================== -->
    <div class="floating-bg" id="floatingBg"></div>

    <script>
    (function() {
        const container = document.getElementById('floatingBg');

        function rand(min, max) { return min + Math.random() * (max - min); }
        function randSign() { return Math.random() > 0.5 ? 1 : -1; }

        // --- COOL SILVER BOKEH ORBS ---
        for (let i = 0; i < 6; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'bokeh');
            const size = rand(30, 80);
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = rand(0, 100) + '%';
            el.style.setProperty('--max-opacity', rand(0.3, 0.6).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.15, 0.4).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.08, 0.2).toFixed(2));
            el.style.setProperty('--sway-1', (rand(15, 40) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(10, 30) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(10, 25) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(5, 15) * randSign()) + 'px');
            const dur = rand(18, 35);
            const delay = rand(0, 15);
            el.style.animation = loatUpLuxury s s linear infinite;
            container.appendChild(el);
        }

        // --- TRANSLUCENT SILVER PETALS ---
        const petalColors = [
            [190, 200, 220],
            [180, 195, 215],
            [200, 210, 230],
            [175, 190, 210],
            [185, 180, 210],
        ];
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'petal');
            const size = rand(10, 22);
            el.style.width = size + 'px';
            el.style.height = (size * rand(0.7, 1.3)) + 'px';
            el.style.left = rand(0, 100) + '%';
            const c = petalColors[Math.floor(Math.random() * petalColors.length)];
            el.style.background = linear-gradient(deg,
                rgba(, , , ) 0%,
                rgba(, , , ) 100%);
            el.style.setProperty('--max-opacity', rand(0.6, 0.9).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.35, 0.6).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.1, 0.25).toFixed(2));
            el.style.setProperty('--sway-1', (rand(20, 50) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(15, 40) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(10, 35) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(5, 20) * randSign()) + 'px');
            el.style.setProperty('--drift-x', (rand(10, 30) * randSign()) + 'px');
            el.style.setProperty('--drift-r', (rand(5, 15) * randSign()) + 'deg');
            const dur = rand(14, 28);
            const delay = rand(0, 15);
            const driftDur = rand(8, 16);
            el.style.animation = loatUpLuxury s s linear infinite, driftSlow s s ease-in-out infinite;
            container.appendChild(el);
        }

        // --- DIAMOND SPARKLES ---
        for (let i = 0; i < 15; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'sparkle');
            const size = rand(3, 6);
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = rand(0, 100) + '%';
            el.style.setProperty('--max-opacity', rand(0.7, 1).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.4, 0.7).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.15, 0.35).toFixed(2));
            el.style.setProperty('--sway-1', (rand(5, 20) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(5, 15) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(3, 12) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(2, 8) * randSign()) + 'px');
            const dur = rand(10, 25);
            const delay = rand(0, 15);
            const pulseDur = rand(2, 5);
            el.style.animation = loatUpLuxury s s linear infinite, pulseSparkle s s ease-in-out infinite;
            container.appendChild(el);
        }
    })();
    </script>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brand-name" href="/">🌸 Halo</a>
            <a href="/" class="btn btn-outline-light btn-sm" style="border-color: var(--border); color: var(--gold);"><i
                    class="bi bi-house"></i> Về cửa hàng</a>
        </div>
    </nav>

    <div class="container profile-container">
        <!-- Flash Messages -->
        <div th:if="${successMsg}" class="alert alert-success"
            style="background: rgba(111,207,154,0.1); border-color: #3dab54; color: #3dab54;" th:text="${successMsg}">
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger"
            style="background: rgba(220,53,69,0.1); border-color: #dc3545; color: #dc3545;" th:text="${errorMsg}"></div>

        <div class="row g-4">
            <!-- Cột 1: Thông tin cá nhân -->
            <div class="col-md-7">
                <div class="card-custom">
                    <h3 class="section-title"><i class="bi bi-person-lines-fill"></i> Thông tin cá nhân</h3>
                    <form action="/profile/update" method="POST" enctype="multipart/form-data">
                        <!-- Avatar Display & Input -->
                        <div class="d-flex flex-column align-items-center mb-4">
                            <div class="position-relative mb-3" style="width: 100px; height: 100px;">
                                <img th:src="${user.avatar != null ? user.avatar : '/images/default-avatar.png'}" 
                                     id="avatarPreview"
                                     class="rounded-circle border border-2 border-gold" 
                                     style="width: 100%; height: 100%; object-fit: cover;"
                                     onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
                            </div>
                            <div class="text-center">
                                <label for="avatarFile" class="btn btn-outline-light btn-sm" style="border-color: var(--border); color: var(--gold); cursor: pointer;">
                                    <i class="bi bi-camera"></i> Chọn ảnh đại diện
                                </label>
                                <input type="file" id="avatarFile" name="avatarFile" accept="image/*" style="display: none;" onchange="previewImage(this)">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Email (Không thể thay đổi)</label>
                            <input type="email" class="form-control" th:value="${user.email}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" name="fullName" th:value="${user.fullName}"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" name="phone" th:value="${user.phone}" placeholder="Nhập số điện thoại">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Địa chỉ giao hàng</label>
                            <textarea class="form-control" name="address" rows="3"
                                placeholder="Nhập địa chỉ mặc định" th:text="${user.address}"></textarea>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Cập nhật thông tin</button>
                    </form>
                </div>
            </div>

            <!-- Cột 2: Đổi mật khẩu -->
            <div class="col-md-5">
                <div class="card-custom">
                    <h3 class="section-title"><i class="bi bi-shield-lock"></i> Đổi mật khẩu</h3>
                    <form action="/profile/change-password" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu hiện tại</label>
                            <input type="password" class="form-control" name="oldPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" name="newPassword" required minlength="6">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" class="form-control" name="confirmPassword" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100"
                            style="border-color: var(--gold); color: var(--gold);">Đổi mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
