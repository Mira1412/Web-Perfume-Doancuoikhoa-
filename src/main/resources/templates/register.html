<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — Halo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a96e; --dark: #0d0d1a; --dark-2: #141428; --border: rgba(201, 169, 110, 0.2);
        }
        body { background-color: var(--dark); font-family: 'Inter', sans-serif; color: #f0ece4; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .login-card { background: var(--dark-2); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .brand-name { font-size: 2rem; font-weight: 700; color: var(--gold); text-align: center; margin-bottom: 20px; display: block; text-decoration: none;}
        .form-control { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 16px; border-radius: 10px; }
        .form-control:focus { background: rgba(0,0,0,0.4); border-color: var(--gold); color: #fff; box-shadow: none; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #a07840); color: #1a1a1a; font-weight: 600; border: none; padding: 12px; border-radius: 10px; transition: all 0.3s; width: 100%; margin-top: 10px; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(201,169,110,0.3); }
        .text-muted a { color: var(--gold); text-decoration: none; font-weight: 500; }
        .text-muted a:hover { text-decoration: underline; }
    
        /* ==================== LUXURY FLOATING BACKGROUND ==================== */
        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .floating-particle {
            position: absolute;
            bottom: -60px;
            pointer-events: none;
            opacity: 0;
            will-change: transform, opacity;
        }

        /* Silver bokeh orbs â€” bright shimmering */
        .floating-particle.bokeh {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                rgba(220, 230, 255, 0.45) 0%, 
                rgba(200, 215, 240, 0.2) 35%, 
                rgba(180, 200, 230, 0.05) 65%,
                transparent 80%);
            box-shadow: 
                inset 0 0 20px rgba(220, 230, 255, 0.2),
                0 0 30px rgba(200, 220, 255, 0.15),
                0 0 60px rgba(180, 200, 245, 0.06);
        }

        /* Elegant petals â€” visible silver shimmer */
        .floating-particle.petal {
            border-radius: 80% 0 55% 50% / 55% 0 80% 50%;
            background: linear-gradient(135deg, 
                rgba(210, 220, 245, 0.5) 0%, 
                rgba(190, 205, 235, 0.25) 50%, 
                rgba(175, 190, 225, 0.08) 100%);
            border: 1px solid rgba(220, 230, 255, 0.15);
            box-shadow: 0 0 12px rgba(200, 215, 250, 0.1);
        }

        /* Diamond sparkle â€” brilliant white-silver glints */
        .floating-particle.sparkle {
            background: rgba(240, 245, 255, 1);
            border-radius: 50%;
            box-shadow: 
                0 0 6px rgba(220, 230, 255, 0.9),
                0 0 15px rgba(200, 215, 250, 0.6),
                0 0 30px rgba(180, 200, 245, 0.3),
                0 0 45px rgba(160, 185, 240, 0.1);
        }

        /* Ambient mist â€” visible cool silver glow */
        .floating-particle.mist {
            border-radius: 50%;
            background: radial-gradient(ellipse at center,
                rgba(160, 180, 230, 0.1) 0%,
                rgba(180, 200, 240, 0.05) 45%,
                transparent 70%);
            filter: blur(25px);
        }

        /* Silver thread â€” visible shimmering lines */
        .floating-particle.thread {
            width: 1px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(210, 220, 250, 0.3) 25%,
                rgba(230, 240, 255, 0.5) 50%,
                rgba(210, 220, 250, 0.3) 75%,
                transparent 100%);
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(200, 215, 250, 0.2);
        }

        @keyframes floatUpLuxury {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            8% {
                opacity: var(--max-opacity, 0.7);
            }
            25% {
                transform: translateY(-25vh) translateX(var(--sway-1, 20px)) rotate(45deg);
            }
            50% {
                opacity: var(--mid-opacity, 0.5);
                transform: translateY(-50vh) translateX(var(--sway-2, -15px)) rotate(120deg);
            }
            75% {
                transform: translateY(-75vh) translateX(var(--sway-3, 10px)) rotate(200deg);
                opacity: var(--fade-opacity, 0.25);
            }
            100% {
                transform: translateY(-110vh) translateX(var(--sway-4, -5px)) rotate(300deg);
                opacity: 0;
            }
        }

        @keyframes driftSlow {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            33% { transform: translateX(var(--drift-x, 15px)) rotate(var(--drift-r, 3deg)); }
            66% { transform: translateX(calc(var(--drift-x, 15px) * -0.7)) rotate(calc(var(--drift-r, 3deg) * -1)); }
        }

        @keyframes pulseSparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes mistDrift {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            20% { opacity: var(--mist-opacity, 0.08); }
            50% { transform: translate(var(--mist-x, 50px), -30vh) scale(1.2); }
            80% { opacity: var(--mist-opacity, 0.08); }
            100% { transform: translate(var(--mist-x2, -30px), -60vh) scale(0.8); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- ==================== FLOATING BACKGROUND ==================== -->
    <div class="floating-bg" id="floatingBg"></div>

    <script>
    (function() {
        const container = document.getElementById('floatingBg');

        function rand(min, max) { return min + Math.random() * (max - min); }
        function randSign() { return Math.random() > 0.5 ? 1 : -1; }

        // --- COOL SILVER BOKEH ORBS ---
        for (let i = 0; i < 6; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'bokeh');
            const size = rand(30, 80);
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = rand(0, 100) + '%';
            el.style.setProperty('--max-opacity', rand(0.3, 0.6).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.15, 0.4).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.08, 0.2).toFixed(2));
            el.style.setProperty('--sway-1', (rand(15, 40) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(10, 30) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(10, 25) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(5, 15) * randSign()) + 'px');
            const dur = rand(18, 35);
            const delay = rand(0, 15);
            el.style.animation = loatUpLuxury s s linear infinite;
            container.appendChild(el);
        }

        // --- TRANSLUCENT SILVER PETALS ---
        const petalColors = [
            [190, 200, 220],
            [180, 195, 215],
            [200, 210, 230],
            [175, 190, 210],
            [185, 180, 210],
        ];
        for (let i = 0; i < 10; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'petal');
            const size = rand(10, 22);
            el.style.width = size + 'px';
            el.style.height = (size * rand(0.7, 1.3)) + 'px';
            el.style.left = rand(0, 100) + '%';
            const c = petalColors[Math.floor(Math.random() * petalColors.length)];
            el.style.background = linear-gradient(deg,
                rgba(, , , ) 0%,
                rgba(, , , ) 100%);
            el.style.setProperty('--max-opacity', rand(0.6, 0.9).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.35, 0.6).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.1, 0.25).toFixed(2));
            el.style.setProperty('--sway-1', (rand(20, 50) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(15, 40) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(10, 35) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(5, 20) * randSign()) + 'px');
            el.style.setProperty('--drift-x', (rand(10, 30) * randSign()) + 'px');
            el.style.setProperty('--drift-r', (rand(5, 15) * randSign()) + 'deg');
            const dur = rand(14, 28);
            const delay = rand(0, 15);
            const driftDur = rand(8, 16);
            el.style.animation = loatUpLuxury s s linear infinite, driftSlow s s ease-in-out infinite;
            container.appendChild(el);
        }

        // --- DIAMOND SPARKLES ---
        for (let i = 0; i < 15; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-particle', 'sparkle');
            const size = rand(3, 6);
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = rand(0, 100) + '%';
            el.style.setProperty('--max-opacity', rand(0.7, 1).toFixed(2));
            el.style.setProperty('--mid-opacity', rand(0.4, 0.7).toFixed(2));
            el.style.setProperty('--fade-opacity', rand(0.15, 0.35).toFixed(2));
            el.style.setProperty('--sway-1', (rand(5, 20) * randSign()) + 'px');
            el.style.setProperty('--sway-2', (rand(5, 15) * randSign()) + 'px');
            el.style.setProperty('--sway-3', (rand(3, 12) * randSign()) + 'px');
            el.style.setProperty('--sway-4', (rand(2, 8) * randSign()) + 'px');
            const dur = rand(10, 25);
            const delay = rand(0, 15);
            const pulseDur = rand(2, 5);
            el.style.animation = loatUpLuxury s s linear infinite, pulseSparkle s s ease-in-out infinite;
            container.appendChild(el);
        }
    })();
    </script>

    <div class="login-card">
        <a href="/" class="brand-name">🌸 Halo</a>
        <h4 class="text-center mb-4" style="font-weight: 600;">Đăng ký tài khoản</h4>

        <div th:if="${errorMsg}" class="alert alert-danger" style="background: rgba(220,53,69,0.1); border-color: #ff6b6b; color: #ff6b6b; border-radius: 10px; font-size: 0.9rem;" th:text="${errorMsg}"></div>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label" style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Họ và tên</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--gold); border-right: none;"><i class="bi bi-person"></i></span>
                    <input type="text" name="fullName" class="form-control" style="border-left: none;" placeholder="Nhập họ và tên" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Email</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--gold); border-right: none;"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control" style="border-left: none;" placeholder="vidu@gmail.com" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label" style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--gold); border-right: none;"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" style="border-left: none;" placeholder="Tạo mật khẩu (ít nhất 6 ký tự)" required minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" style="font-size: 0.9rem; color: rgba(255,255,255,0.7);">Xác nhận mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.1); color: var(--gold); border-right: none;"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" name="confirmPassword" class="form-control" style="border-left: none;" placeholder="Nhập lại mật khẩu" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-gold">Đăng Ký</button>
        </form>

        <div class="text-center mt-4 text-muted" style="font-size: 0.9rem;">
            Đã có tài khoản? <a href="/login">Đăng nhập</a><br><br>
            <a href="/" style="color: rgba(255,255,255,0.5);"><i class="bi bi-arrow-left"></i> Quay lại cửa hàng</a>
        </div>
    </div>

</body>
</html>
